    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #03060d;
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Particle Canvas Background */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* Mouse Tracking Interactive Glowing Aura Mass */
        #interactive-aura {
            position: fixed;
            width: 520px;
            height: 520px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(83, 252, 24, 0.18) 0%, rgba(147, 51, 234, 0.15) 45%, rgba(225, 48, 108, 0.1) 75%, rgba(0,0,0,0) 100%);
            filter: blur(75px);
            pointer-events: none;
            z-index: 1;
            transform: translate(-50%, -50%);
            will-change: transform, left, top;
        }

        /* Holographic Orbit Border & Floating Avatar Effect */
        @keyframes orbitRotate1 {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.04); }
            100% { transform: rotate(360deg) scale(1); }
        }

        @keyframes orbitRotate2 {
            0% { transform: rotate(360deg) scale(1.03); }
            50% { transform: rotate(180deg) scale(0.97); }
            100% { transform: rotate(0deg) scale(1.03); }
        }

        @keyframes avatarBreath3D {
            0% {
                transform: translateY(0px) rotateX(0deg) rotateY(0deg);
                box-shadow: 0 0 35px rgba(83, 252, 24, 0.35), 0 0 70px rgba(168, 85, 247, 0.25);
            }
            50% {
                transform: translateY(-12px) rotateX(4deg) rotateY(-4deg);
                box-shadow: 0 0 60px rgba(83, 252, 24, 0.65), 0 0 110px rgba(225, 48, 108, 0.45);
            }
            100% {
                transform: translateY(0px) rotateX(0deg) rotateY(0deg);
                box-shadow: 0 0 35px rgba(83, 252, 24, 0.35), 0 0 70px rgba(168, 85, 247, 0.25);
            }
        }

        .avatar-3d-wrapper {
            perspective: 1000px;
        }

        .avatar-3d-card {
            animation: avatarBreath3D 4.2s ease-in-out infinite;
            transform-style: preserve-3d;
            border-radius: 50%;
        }

        .avatar-ring-container {
            position: relative;
        }

        .avatar-ring-container::before {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, #53fc18, #00f2fe, #4facfe, #e1306c, #9333ea, #53fc18);
            background-size: 400% 400%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: orbitRotate1 7s linear infinite;
        }

        .avatar-ring-container::after {
            content: '';
            position: absolute;
            inset: -16px;
            border-radius: 50%;
            padding: 2px;
            border: 2px dashed rgba(83, 252, 24, 0.5);
            animation: orbitRotate2 12s linear infinite;
        }

        /* Gradient Username Text Animation */
        @keyframes textShimmerWave {
            0% { background-position: 0% 50%; filter: drop-shadow(0 0 10px rgba(83, 252, 24, 0.5)); }
            50% { background-position: 100% 50%; filter: drop-shadow(0 0 22px rgba(225, 48, 108, 0.8)); }
            100% { background-position: 0% 50%; filter: drop-shadow(0 0 10px rgba(83, 252, 24, 0.5)); }

        .animated-username {
            background: linear-gradient(90deg, #53fc18, #ffffff, #00f2fe, #e1306c, #a855f7, #53fc18);

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textShimmerWave 4s ease infinite;
            letter-spacing: 2.5px;
        }

        /* Glassmorphism Cards */
        .glass-card {
            background: rgba(10, 15, 28, 0.72);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);

        @keyframes eqBarPulse {

        .eq-bar {
            width: 3px;
            background: linear-gradient(to top, #53fc18, #00f2fe, #e1306c);
            border-radius: 3px;
            height: 4px;
        }

        .playing .eq-1 { animation: eqBarPulse 0.7s ease-in-out infinite 0.1s; }
        .playing .eq-2 { animation: eqBarPulse 0.6s ease-in-out infinite 0.3s; }
        .playing .eq-3 { animation: eqBarPulse 0.8s ease-in-out infinite 0.2s; }
        .playing .eq-4 { animation: eqBarPulse 0.5s ease-in-out infinite 0.4s; }

        /* Custom Range Input */
        input[type=range] {
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.12);
            height: 5px;
            border-radius: 5px;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #53fc18;
            cursor: pointer;
            box-shadow: 0 0 12px #53fc18;
            transition: transform 0.2s;
        }

        input[type=range]::-webkit-slider-thumb:hover {

        }

        /* Click Ripple Effect */
        .click-ripple {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            border: 2px solid rgba(83, 252, 24, 0.85);

        @keyframes rippleBurst {

        /* Pulsing Live / Offline Dot */

            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); }

            animation: audioNoticeGlow 3s ease-in-out infinite;

    <script>
        // Mouse/Touch Tracking Interactive Aura
        const aura = document.getElementById('interactive-aura');
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let auraX = mouseX;
        let auraY = mouseY;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                mouseX = e.touches[0].clientX;
                mouseY = e.touches[0].clientY;
            }
        });

        function animateAura() {
            auraX += (mouseX - auraX) * 0.08;
            auraY += (mouseY - auraY) * 0.08;
            
            aura.style.left = `${auraX}px`;
            aura.style.top = `${auraY}px`;

            requestAnimationFrame(animateAura);
        }
        animateAura();

        // Click Ripple & Sparkle Effects
        window.addEventListener('click', (e) => {
            createRipple(e.clientX, e.clientY);
            for (let i = 0; i < 10; i++) {
                spawnSparkle(e.clientX, e.clientY);
            }
        });

        function createRipple(x, y) {
            const ripple = document.createElement('div');
            ripple.className = 'click-ripple';
            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;
            document.body.appendChild(ripple);

            setTimeout(() => ripple.remove(), 700);
        }

        function spawnSparkle(x, y) {
            const sparkle = document.createElement('div');
            const size = Math.random() * 7 + 4;
            const colors = ['#53fc18', '#00f2fe', '#e1306c', '#a855f7', '#ffffff'];
            const color = colors[Math.floor(Math.random() * colors.length)];

            sparkle.style.position = 'fixed';
            sparkle.style.left = `${x}px`;
            sparkle.style.top = `${y}px`;
            sparkle.style.width = `${size}px`;
            sparkle.style.height = `${size}px`;
            sparkle.style.backgroundColor = color;
            sparkle.style.borderRadius = '50%';
            sparkle.style.pointerEvents = 'none';
            sparkle.style.zIndex = '9999';
            sparkle.style.boxShadow = `0 0 12px ${color}`;

            document.body.appendChild(sparkle);

            const destinationX = (Math.random() - 0.5) * 140;
            const destinationY = (Math.random() - 0.5) * 140;

            const anim = sparkle.animate([
                { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                { transform: `translate(${destinationX}px, ${destinationY}px) scale(0)`, opacity: 0 }
            ], {
                duration: 650 + Math.random() * 350,
                easing: 'cubic-bezier(0, .9, .57, 1)'
            });

            anim.onfinish = () => sparkle.remove();
        }

        // Particle Canvas Animation
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const particles = [];
        const particleCount = 65;

        class BackgroundParticle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.2 + 0.6;
                this.speedX = (Math.random() - 0.5) * 0.45;
                this.speedY = (Math.random() - 0.5) * 0.45;
                this.alpha = Math.random() * 0.75 + 0.2;
                this.pulseSpeed = Math.random() * 0.02 + 0.005;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                this.alpha += Math.sin(Date.now() * this.pulseSpeed) * 0.006;

                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, Math.min(1, this.alpha));
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < particleCount; i++) {
            particles.push(new BackgroundParticle());
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // Kick Channel Status Sync
        const channelSlug = "naka125";
        const statusBadge = document.getElementById('statusBadge');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const followersCountEl = document.getElementById('followersCount');

        function formatNumber(num) {
            if (!num || isNaN(num)) return '125K+';
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        async function fetchKickStatus() {
            try {
                const response = await fetch(`https://kick.com/api/v2/channels/${channelSlug}`);
                if (!response.ok) throw new Error("API request failed");
                
                const data = await response.json();
                const isLive = data.livestream !== null && data.livestream !== undefined;
                
                if (isLive) {
                    statusBadge.className = "flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 text-xs font-bold transition-all duration-500 shadow-lg shadow-emerald-500/10";
                    statusDot.className = "w-2.5 h-2.5 rounded-full bg-emerald-400 inline-block live-dot";
                } else {
                    statusBadge.className = "flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-rose-500/20 text-rose-400 border border-rose-500/40 text-xs font-bold transition-all duration-500 shadow-lg shadow-rose-500/10";
                    statusDot.className = "w-2.5 h-2.5 rounded-full bg-rose-500 inline-block offline-dot";
                }
                statusText.textContent = "LIVE KICK";

                const followers = data.followersCount || data.followers_count || data.followers_num;
                if (followers) {
                    followersCountEl.textContent = formatNumber(followers);
                }
            } catch (err) {
                statusBadge.className = "flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-rose-500/20 text-rose-400 border border-rose-500/40 text-xs font-bold transition-all duration-500 shadow-lg shadow-rose-500/10";
                statusDot.className = "w-2.5 h-2.5 rounded-full bg-rose-500 inline-block offline-dot";
                statusText.textContent = "LIVE KICK";
            }
        }

        fetchKickStatus();
        setInterval(fetchKickStatus, 15000);

        const notifSound = document.getElementById('notifSound');
        const bgMusic = document.getElementById('bgMusic');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const musicStatus = document.getElementById('musicStatus');
        const eqContainer = document.getElementById('eqContainer');
        const progressBar = document.getElementById('progressBar');
        const volumeBar = document.getElementById('volumeBar');
        const volumeIcon = document.getElementById('volumeIcon');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');
        const audioNotice = document.getElementById('audioNotice');
        const closeNoticeBtn = document.getElementById('closeNoticeBtn');

        bgMusic.volume = volumeBar.value / 100;
        notifSound.volume = 0.8;

        function dismissNotice() {
            if (audioNotice) {
                audioNotice.style.transition = 'opacity 0.4s ease, transform 0.4s ease';
                audioNotice.style.opacity = '0';
                audioNotice.style.transform = 'translateY(-20px)';
                setTimeout(() => audioNotice.remove(), 400);
            }
        }

        if (closeNoticeBtn) {
            closeNoticeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                dismissNotice();
            });
        }

        function setPlayingUI() {
            playIcon.className = 'fa-solid fa-pause text-base';
            musicStatus.textContent = 'Playing';
            eqContainer.classList.add('playing');
            dismissNotice();
        }

        function setPausedUI() {
            playIcon.className = 'fa-solid fa-play text-base';
            musicStatus.textContent = 'Paused';
            eqContainer.classList.remove('playing');
        }

        // Trigger notification.mp3 and music.mp3 on first user interaction
        function handleFirstInteraction() {
            notifSound.play().catch(err => console.log("Notif sound play blocked:", err));

            if (bgMusic.paused) {
                bgMusic.play().then(() => {
                    setPlayingUI();
                }).catch(err => console.log("Music play blocked:", err));
            }

            dismissNotice();

            interactionEvents.forEach(evt => {
                window.removeEventListener(evt, handleFirstInteraction);
            });
        }

        const interactionEvents = ['click', 'touchstart', 'pointerdown', 'keydown'];
        interactionEvents.forEach(evt => {
            window.addEventListener(evt, handleFirstInteraction);
        });

        // Toggle music play/pause
        playBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (bgMusic.paused) {
                bgMusic.play().then(() => {
                    setPlayingUI();
                }).catch(() => {
                    musicStatus.textContent = 'music.mp3 missing';
                });
            } else {
                bgMusic.pause();
                setPausedUI();
            }
        });

        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        bgMusic.addEventListener('timeupdate', () => {
            if (bgMusic.duration) {
                const progressPercent = (bgMusic.currentTime / bgMusic.duration) * 100;
                progressBar.value = progressPercent;
                currentTimeEl.textContent = formatTime(bgMusic.currentTime);
                durationTimeEl.textContent = formatTime(bgMusic.duration);
            }
        });

        progressBar.addEventListener('input', (e) => {
            e.stopPropagation();
            if (bgMusic.duration) {
                bgMusic.currentTime = (progressBar.value / 100) * bgMusic.duration;
            }
        });

        volumeBar.addEventListener('input', (e) => {
            e.stopPropagation();
            const vol = volumeBar.value / 100;
            bgMusic.volume = vol;
            
            if (vol === 0) {
                volumeIcon.className = 'fa-solid fa-volume-xmark text-xs text-slate-500';
            } else if (vol < 0.5) {
                volumeIcon.className = 'fa-solid fa-volume-low text-xs text-slate-400';
            } else {
                volumeIcon.className = 'fa-solid fa-volume-high text-xs text-slate-400';
            }
        });
    </script>
</body>
</html>
